name: Build and package

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -Installer -BootstrapCompiler
      - name: Verify installer lifecycle
        shell: pwsh
        run: ./scripts/Test-Installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: YMusicTaskbar-windows
          path: dist/*
          if-no-files-found: error
          compression-level: 0
